name: tredro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  init:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py initialize_application &&
             python manage.py collectstatic --noinput"
    env_file:
      - .env
    environment: &app-environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      API_DOMAIN: ${API_DOMAIN:-api.tredro.online}
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: >
      gunicorn config.wsgi:application
      --bind $${GUNICORN_BIND:-0.0.0.0:8000}
      --workers $${GUNICORN_WORKERS:-5}
      --timeout $${GUNICORN_TIMEOUT:-60}
      --max-requests 1000
      --max-requests-jitter 100
      --access-logfile -
      --error-logfile -
    env_file:
      - .env
    environment: *app-environment
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent
          --header "Host: $${API_DOMAIN}"
          --header "X-Forwarded-Proto: https"
          http://localhost:8000/api/health/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - frontend
      - private

  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "celery -A config worker --loglevel=info
             --concurrency=$${CELERY_WORKER_CONCURRENCY:-2}"
    env_file:
      - .env
    environment: *app-environment
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - private

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - .env
    environment: *app-environment
    volumes:
      - celery_beat_data:/var/lib/celery
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - private

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.tredro.online}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  celery_beat_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  private:
    internal: true
